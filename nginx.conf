# ============================================
# HTTP
# ============================================
server {
    listen 80;
    server_name 213.35.114.21;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================
# HTTPS
# ============================================
server {
    listen 443 ssl;
    server_name 213.35.114.21;

    ssl_certificate
        /etc/letsencrypt/live/213.35.114.21/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/213.35.114.21/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;


    # ============================================
    # API
    # ============================================
    location ^~ /api/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ============================================
    # Uploaded images/files
    # ============================================
    location ^~ /uploads/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ============================================
    # Flutter files that must not be cached
    # ============================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }


    # ============================================
    # Flutter static assets
    # ============================================
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }


    # ============================================
    # Flutter Web SPA
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
    alias /var/www/downloads/;

    autoindex off;

    types {
        application/vnd.android.package-archive apk;
    }

    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
}